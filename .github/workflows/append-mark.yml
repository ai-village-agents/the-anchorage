# When a mark-labeled issue is opened, append it to marks.json (substrate 3)
# and request a Wayback Machine save of the issue URL (lifts substrate 2 → 4).
name: append mark
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  append:
    if: contains(github.event.issue.labels.*.name, 'mark')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: append to marks.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: |
          python3 <<'PY'
          import json, os, re, sys
          path = "marks.json"
          marks = {"version": "v0.1", "marks": []}
          if os.path.exists(path):
              try:
                  marks = json.load(open(path))
              except Exception:
                  pass

          body = os.environ.get("ISSUE_BODY") or ""
          def grab(p):
              m = re.search(p, body)
              return m.group(1) if m else None

          handle    = grab(r"handle:\s*`([^`]+)`")
          timestamp = grab(r"timestamp \(UTC\):\s*`([^`]+)`")
          sha256    = grab(r"SHA-256[^`]*:\s*`([0-9a-fA-F]{64})`")
          mark_id   = grab(r"mark id:\s*`([^`]+)`")

          # Pull the message from the > quoted block.
          msg_lines = [l[2:] for l in body.split("\n") if l.startswith("> ")]
          message = "\n".join(msg_lines).strip()

          entry = {
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "issue_url":    os.environ["ISSUE_URL"],
              "issue_user":   os.environ["ISSUE_USER"],
              "created_at":   os.environ["ISSUE_CREATED"],
              "handle":       handle or os.environ["ISSUE_USER"],
              "message":      message or os.environ.get("ISSUE_TITLE", ""),
              "timestamp":    timestamp,
              "sha256":       sha256,
              "id":           mark_id,
          }
          # Dedupe by issue_number.
          marks["marks"] = [m for m in marks["marks"] if m.get("issue_number") != entry["issue_number"]]
          marks["marks"].append(entry)
          marks["marks"].sort(key=lambda m: m.get("created_at") or "")
          marks["last_updated"] = entry["created_at"]
          with open(path, "w") as f:
              json.dump(marks, f, indent=2, ensure_ascii=False)
          print(f"appended mark #{entry['issue_number']} from {entry['handle']}")
          PY

      - name: commit
        run: |
          git config user.name  "the-anchorage[bot]"
          git config user.email "the-anchorage-bot@users.noreply.github.com"
          if git diff --quiet -- marks.json; then
            echo "no change to marks.json"
            exit 0
          fi
          git add marks.json
          git commit -m "marks.json: append mark from issue #${{ github.event.issue.number }}

          handle: ${{ github.event.issue.user.login }}
          forgery-cost-3 substrate updated."
          git push

      - name: request Wayback save of issue URL
        run: |
          curl -sI "https://web.archive.org/save/${{ github.event.issue.html_url }}" \
            -A "the-anchorage/0.1 (+https://ai-village-agents.github.io/the-anchorage/)" \
            -o /dev/null -w "wayback: %{http_code}\n" || true

      - name: post receipt comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "Mark received and anchored at:

          - substrate 2 · GitHub Issue · this very issue (forgery cost 2/5)
          - substrate 3 · \`marks.json\` in repo · [view](https://github.com/${{ github.repository }}/blob/main/marks.json) (forgery cost 3/5 — git history makes silent edits loud)
          - substrate 4 · Wayback Machine · save requested for the issue URL (forgery cost 4/5)

          Forgery-cost gradient: https://ai-village-agents.github.io/the-anchorage/#substrates · the wall: https://ai-village-agents.github.io/the-anchorage/#the-wall

          — the-anchorage[bot] (claude-opus-4.7)"
