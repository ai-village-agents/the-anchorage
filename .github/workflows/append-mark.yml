# When a mark-labeled issue (or one whose title starts with "mark · ") is
# opened, append it to marks.json (substrate 3) and request a Wayback Machine
# save of the issue URL (lifts substrate 2 → 4).
name: append mark
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  append:
    if: |
      contains(github.event.issue.labels.*.name, 'mark') ||
      startsWith(github.event.issue.title, 'mark · ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ensure mark label present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HAS_LABEL: ${{ contains(github.event.issue.labels.*.name, 'mark') }}
        run: |
          if [ "$HAS_LABEL" != "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label mark || true
          fi

      - name: append to marks.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          python3 - <<'PY'
          import json, os, re
          body = os.environ.get('ISSUE_BODY','') or ''
          n = int(os.environ.get('ISSUE_NUMBER','0'))
          user = os.environ.get('ISSUE_USER','')
          url = os.environ.get('ISSUE_URL','')
          created = os.environ.get('ISSUE_CREATED_AT','')

          def grab(field):
              m = re.search(r'-\s*'+re.escape(field)+r':\s*`([^`]*)`', body)
              return m.group(1) if m else None

          handle = grab('handle')
          ts = grab('timestamp (UTC)') or grab('timestamp')
          sha = grab('SHA-256 of (handle ‖ message ‖ timestamp)') or grab('sha256') or grab('SHA-256')
          mid = grab('mark id')

          msg = None
          mq = re.search(r'(?:^|\n)>\s?(.+?)(?:\n\n|$)', body, re.S)
          if mq:
              msg = mq.group(1).rstrip()

          entry = {
              'issue_number': n, 'issue_url': url, 'issue_user': user,
              'created_at': created, 'handle': handle, 'message': msg,
              'timestamp': ts, 'sha256': sha, 'id': mid,
          }

          path = 'marks.json'
          with open(path,'r') as f:
              data = json.load(f)
          existing_idx = None
          for i, m in enumerate(data.get('marks', [])):
              if m.get('issue_number') == n:
                  existing_idx = i; break
          if existing_idx is not None:
              data['marks'][existing_idx] = entry
          else:
              data.setdefault('marks', []).append(entry)
          data['last_updated'] = created or data.get('last_updated')
          with open(path,'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: commit marks.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "the-anchorage[bot]"
          git config user.email "the-anchorage-bot@users.noreply.github.com"
          if git diff --quiet marks.json; then
            echo "marks.json unchanged"
          else
            git add marks.json
            git commit -m "marks: append issue #${ISSUE_NUMBER}"
            git push
          fi

      - name: request Wayback Machine save (substrate 4)
        env:
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          curl -sS -L -A "Mozilla/5.0 (the-anchorage[bot])" \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "https://web.archive.org/save/${ISSUE_URL}" || true

      - name: post receipt comment (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh api "/repos/$REPO/issues/$ISSUE_NUMBER/comments" --jq '[.[] | select(.user.login=="github-actions[bot]") | select(.body|contains("Mark received and anchored at"))] | length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "receipt already posted, skipping"
            exit 0
          fi
          cat > /tmp/receipt.md <<'MD'
          Mark received and anchored at:

          - substrate 2 · GitHub Issue · this very issue (forgery cost 2/5)
          - substrate 3 · `marks.json` in repo · [view](https://github.com/ai-village-agents/the-anchorage/blob/main/marks.json) (forgery cost 3/5 — git history makes silent edits loud)
          - substrate 4 · Wayback Machine · save requested for the issue URL (forgery cost 4/5)

          Forgery-cost gradient → https://ai-village-agents.github.io/the-anchorage/#substrates
          The wall → https://ai-village-agents.github.io/the-anchorage/#the-wall

          — the-anchorage[bot] (claude-opus-4.7)
          MD
          # Strip the leading 10 spaces of indentation that the YAML block adds
          sed -i 's/^          //' /tmp/receipt.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/receipt.md
